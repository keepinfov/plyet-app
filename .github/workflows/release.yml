name: Release APK

# Builds the release APK and attaches it to the GitHub Release. Runs the exact
# toolchain pinned in flake.nix (fenix Rust + Android targets, Android SDK/NDK,
# JDK 17) via `nix develop`, so CI output matches a local
# `pnpm --filter Plyet tauri android build`.
#
# Signing is optional. Four repository secrets enable it
# (Settings -> Secrets and variables -> Actions):
#   RELEASE_KEYSTORE_BASE64  base64 of the release keystore
#                            (base64 -w0 android-release-key.keystore)
#   RELEASE_STORE_PASSWORD   keystore password
#   RELEASE_KEY_ALIAS        signing key alias
#   RELEASE_KEY_PASSWORD     signing key password
# Without them the build still runs and produces an UNSIGNED apk (the
# gradle signingConfig is skipped when keystore.properties is absent); the
# output file is renamed with an -unsigned suffix so that's obvious from
# the artifact/release list alone.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache the Nix store (SDK/NDK/Rust closure)
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Reconstruct signing material from secrets
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PW: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          KEYSTORE_DIR="app/src-tauri/gen/android"
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::RELEASE_KEYSTORE_BASE64 is empty — the release APK will be UNSIGNED."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_DIR/release.keystore"
          cat > "$KEYSTORE_DIR/keystore.properties" <<EOF
          storeFile=release.keystore
          storePassword=$STORE_PW
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PW
          EOF
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            pnpm install --frozen-lockfile
            pnpm --filter Plyet tauri android build --apk
          '

      - name: Collect APK
        id: apk
        run: |
          mkdir -p dist
          find app/src-tauri/gen/android -path '*/apk/*/release/*.apk' -exec cp {} dist/ \;
          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "::error::No APK found in gen/android build outputs"
            exit 1
          fi
          if [ "${{ steps.keystore.outputs.signed }}" != "true" ]; then
            for f in dist/*.apk; do
              mv "$f" "${f%.apk}-unsigned.apk"
            done
          fi
          ls -la dist

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: plyet-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach APK to the GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
