<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>re:glass material — playground</title>
    <script>try{var p="rg",d=document.documentElement,g=function(k){return localStorage.getItem(p+'-'+k)};d.setAttribute('data-theme',g('theme')||'light');d.setAttribute('data-accent',g('accent')||'blue');d.setAttribute('data-blur',g('blur')==='off'?'off':'on');d.setAttribute('data-transparency',g('transparency')==='off'?'off':'on');}catch(e){}</script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
